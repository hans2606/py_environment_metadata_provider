[project]
name = "py-environment-metadata-provider"
version = "0.1.0"
description = "Captures static process and host details at startup for use in structured logging."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
